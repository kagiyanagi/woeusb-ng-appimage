name: Build AppImage

on:
  workflow_dispatch:
    inputs:
      version:
        description: "WoeUSB-ng version to build, or 'latest'"
        required: false
        default: "latest"

permissions:
  contents: read

jobs:
  build:
    # Builds, smoke-tests, and uploads one x86_64 AppImage artifact.
    name: Build WoeUSB-ng AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve WoeUSB-ng version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          input="${INPUT_VERSION//[[:space:]]/}"
          input="${input,,}"
          input="${input:-latest}"

          # Resolve "latest" at run time so the workflow does not need updates.
          if [[ "$input" == "latest" ]]; then
            version="$(
              git ls-remote --tags https://github.com/WoeUSB/WoeUSB-ng.git 'refs/tags/v*' \
                | sed -E 's#.*refs/tags/v##; s#\^\{\}##' \
                | grep -E '^[0-9]+(\.[0-9]+)*$' \
                | sort -Vr \
                | head -1
            )"
          else
            version="${input#v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Invalid WoeUSB-ng version: $version" >&2
            exit 1
          fi

          # Fail early if the requested upstream tag does not exist.
          git ls-remote --exit-code --tags https://github.com/WoeUSB/WoeUSB-ng.git "refs/tags/v${version}" >/dev/null

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building WoeUSB-ng v${version}"

      - name: Build AppImage in AlmaLinux 9
        shell: bash
        run: |
          set -euo pipefail

          # EL9 sets the oldest glibc (2.34) the AppImage runs on; see build.sh.
          docker run --rm \
            -e WOEUSB_VERSION="${{ steps.version.outputs.version }}" \
            -v "$PWD":/work \
            -w /work \
            almalinux:9 \
            bash -lc '
              set -euo pipefail

              dnf install -y epel-release
              dnf install -y dnf-plugins-core git cpio file patchelf

              ./build.sh "$WOEUSB_VERSION"

              # Smoke test the artifact before uploading it.
              app="build/WoeUSB-ng-${WOEUSB_VERSION}-x86_64.AppImage"

              APPIMAGE_EXTRACT_AND_RUN=1 "$app" --version | tee build/appimage-version.txt
              grep -Fx "$WOEUSB_VERSION" build/appimage-version.txt

              APPIMAGE_EXTRACT_AND_RUN=1 "$app" --help >/dev/null
            '

      - name: Upload AppImage artifact
        # Store the final AppImage on the workflow run.
        uses: actions/upload-artifact@v4
        with:
          name: WoeUSB-ng-${{ steps.version.outputs.version }}-x86_64.AppImage
          path: build/WoeUSB-ng-${{ steps.version.outputs.version }}-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

  test:
    # The build container hides missing host dependencies, so run the
    # AppImage on the distros users run it on.
    name: Test on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - docker.io/library/almalinux:9
          - docker.io/library/debian:12
          - docker.io/library/debian:13
          - docker.io/library/ubuntu:22.04
          - docker.io/library/ubuntu:24.04
          - docker.io/library/fedora:latest
          - docker.io/opensuse/leap:15.6
          - docker.io/opensuse/tumbleweed:latest
          - docker.io/library/archlinux:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: WoeUSB-ng-${{ needs.build.outputs.version }}-x86_64.AppImage

      - name: Run smoke test
        shell: bash
        run: |
          chmod +x WoeUSB-ng-*.AppImage
          ./test.sh WoeUSB-ng-*.AppImage "${{ matrix.image }}"
