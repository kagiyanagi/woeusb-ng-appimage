name: Build AppImage

on:
  workflow_dispatch:
    inputs:
      version:
        description: "WoeUSB-ng version to build, or 'latest'"
        required: false
        default: "latest"

permissions:
  contents: read

jobs:
  build:
    # Builds, smoke-tests, and uploads one x86_64 AppImage artifact.
    name: Build WoeUSB-ng AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve WoeUSB-ng version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          input="${{ github.event.inputs.version }}"
          input="${input//[[:space:]]/}"
          input="${input,,}"
          input="${input:-latest}"

          # Resolve "latest" at run time so the workflow does not need updates.
          if [[ "$input" == "latest" ]]; then
            version="$(
              git ls-remote --tags https://github.com/WoeUSB/WoeUSB-ng.git 'refs/tags/v*' \
                | sed -E 's#.*refs/tags/v##; s#\^\{\}##' \
                | grep -E '^[0-9]+(\.[0-9]+)*$' \
                | sort -Vr \
                | head -1
            )"
          else
            version="${input#v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Invalid WoeUSB-ng version: $version" >&2
            exit 1
          fi

          # Fail early if the requested upstream tag does not exist.
          git ls-remote --exit-code --tags https://github.com/WoeUSB/WoeUSB-ng.git "refs/tags/v${version}" >/dev/null

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building WoeUSB-ng v${version}"

      - name: Restore RPM cache
        # Reuse downloaded Fedora RPMs between manual runs.
        uses: actions/cache@v4
        with:
          path: build/deps-rpms
          key: woeusb-ng-rpms-${{ runner.os }}-${{ steps.version.outputs.version }}-${{ hashFiles('build.sh') }}
          restore-keys: |
            woeusb-ng-rpms-${{ runner.os }}-${{ steps.version.outputs.version }}-
            woeusb-ng-rpms-${{ runner.os }}-

      - name: Build AppImage in Fedora
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e WOEUSB_VERSION="${{ steps.version.outputs.version }}" \
            -v "$PWD":/work \
            -w /work \
            fedora:latest \
            bash -lc '
              set -euo pipefail

              # Keep generated build files writable by the runner.
              trap "chown -R ${HOST_UID}:${HOST_GID} /work/build 2>/dev/null || true" EXIT

              dnf install -y \
                git wget python3 python3-pip python3-wxpython4 \
                patchelf rpm-build cpio file findutils binutils

              ./build.sh "$WOEUSB_VERSION" --no-clean

              # Smoke test the artifact before uploading it.
              app="build/WoeUSB-ng-${WOEUSB_VERSION}-x86_64.AppImage"
              test -s "$app"

              APPIMAGE_EXTRACT_AND_RUN=1 "$app" --version | tee build/appimage-version.txt
              grep -Fx "$WOEUSB_VERSION" build/appimage-version.txt

              APPIMAGE_EXTRACT_AND_RUN=1 "$app" --help >/dev/null
            '

      - name: Upload AppImage artifact
        # Store the final AppImage on the workflow run.
        uses: actions/upload-artifact@v4
        with:
          name: WoeUSB-ng-${{ steps.version.outputs.version }}-x86_64.AppImage
          path: build/WoeUSB-ng-${{ steps.version.outputs.version }}-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Write job summary
        # Show the produced version and artifact name in the run summary.
        shell: bash
        run: |
          {
            echo "## AppImage build"
            echo
            echo "- Version: \`${{ steps.version.outputs.version }}\`"
            echo "- Artifact: \`WoeUSB-ng-${{ steps.version.outputs.version }}-x86_64.AppImage\`"
            echo "- Retention: 14 days"
          } >> "$GITHUB_STEP_SUMMARY"
